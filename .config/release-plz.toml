# release-plz (https://release-plz.dev), run with --config .config/release-plz.toml.
[workspace]
# Tags are `<crate>/v<version>`.
git_tag_name = "{{ package }}/v{{ version }}"
# The tag workflow (tag.yml) creates the GitHub releases, with gh.
git_release_enable = false
# Publish and tag only when the release PR is merged.
release_always = false
changelog_update = true

# lsdocs-plugin-sdk's bindings always have its version (bumped with it).
[[package]]
name = "lsdocs-plugin-sdk"
version_group = "plugin-sdk"

[[package]]
name = "lsdocs-plugin-python"
version_group = "plugin-sdk"
# Released (tagged, changelog) but not on crates.io; tracked by its tags.
publish = false
git_only = true

[[package]]
name = "lsdocs-plugin-node"
version_group = "plugin-sdk"
# Released (tagged, changelog) but not on crates.io; tracked by its tags.
publish = false
git_only = true
