name: CI

on:
  push:
    # TEMP: verify lsdocs/.github's branch; revert before merging.
    branches: [main, ccr-05990b37-mdy4p6]
    # Files that cannot change a build.
    paths-ignore: &no-build
      - "*.md"
      - "**/CHANGELOG.md"
      - "LICENSE*"
      - renovate.json
      - .gitignore
  pull_request:
    branches: [main]
    paths-ignore: *no-build

permissions: {}

# A new push to a pull request cancels its previous run; runs on main finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: lsdocs/.github/.github/workflows/ci.yml@ccr-05990b37-mdy4p6
    permissions:
      contents: read
    with:
      # The LuaJIT specs on Windows (mlua's vendored LuaJIT).
      msvc-dev-cmd: true

  # Each crate on its own rust-version (nur msrv installs the toolchains).
  msrv:
    uses: lsdocs/.github/.github/workflows/msrv.yml@main
    permissions:
      contents: read
