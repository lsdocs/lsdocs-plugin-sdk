[workspace]
resolver = "3"
members = [
    "crates/*",
    "bindings/*",
]

[workspace.package]
edition = "2024"
# The base MSRV; crates needing more set their own (`nur msrv` checks
# each crate on its own).
rust-version = "1.89"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/lsdocs/lsdocs-plugin-sdk"

[workspace.dependencies]
lsdocs-protocol = { git = "https://github.com/lsdocs/lsdocs-protocol", branch = "main", version = "0.1.0" }
lsdocs-rpc = { path = "crates/rpc", version = "0.1.0" }
lsdocs-plugin-sdk = { path = "crates/plugin-sdk", version = "0.1.0" }
lsdocs-plugin-sdk-bindings = { path = "crates/plugin-sdk-bindings", version = "0.1.0" }

bytes = "1.12.1"
futures-util = { version = "0.3.34", default-features = false }
libc = "0.2.191"
napi = { version = "3.16.2", features = ["tokio_rt"] }
napi-build = "2.6.0"
napi-derive = "3.7.1"
# The stable ABI (abi3-py311 or abi3t-py315) is chosen per wheel build
# (lsdocs/.github's build-wheels.yml, `--features pyo3/<abi>`).
pyo3 = { version = "0.30.1", features = ["generate-import-lib"] }
pythonize = "0.30.0"
rmp = "0.8.15"
rmp-serde = "1.3.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", default-features = false }
tokio-util = { version = "0.7.20", default-features = false }
toml = "1.2.1"
# No `attributes` (`#[instrument]`): it pulls in syn 2.
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = "0.3.23"
windows-sys = "0.61.2"

[workspace.lints.rust]
# `deny` rather than `forbid` so the rpc crate can opt in locally with
# `#[allow(unsafe_code)]` for handle duplication (Phase 2).
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Library and binary code returns errors instead of panicking. Tests opt
# out with `#![allow(clippy::unwrap_used, ...)]` at the top of the module.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
