[package]
name = "lsdocs-plugin-sdk"
description = "Traits and serve() entry point for writing lsdocs plugins in Rust."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
lsdocs-protocol.workspace = true
lsdocs-rpc.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "time", "net", "io-util"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
