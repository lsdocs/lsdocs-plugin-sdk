[package]
name = "lsdocs-rpc"
description = "MessagePack RPC envelope, framing, codec, peer and transports."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
bytes.workspace = true
futures-util = { workspace = true, features = ["sink"] }
lsdocs-protocol.workspace = true
rmp.workspace = true
rmp-serde.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "macros", "io-util", "io-std", "net", "time", "fs"] }
tokio-util = { workspace = true, features = ["codec"] }
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
libc.workspace = true
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Threading"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "process", "macros", "time"] }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
