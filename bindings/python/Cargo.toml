[package]
name = "lsdocs-python"
description = "Python bindings (pyo3) for writing lsdocs plugins."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# Imported as `lsdocs_plugin._native`; see pyproject.toml.
name = "_native"
crate-type = ["cdylib"]
# Needs a Python interpreter to run; tested with pytest instead.
test = false
doctest = false

[lints]
workspace = true

[dependencies]
lsdocs-plugin-sdk.workspace = true
lsdocs-sdk-dynamic.workspace = true
pyo3.workspace = true
pythonize.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "time", "net", "io-util"] }
