[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "lsdocs-plugin"
# The version is the binding crate's (Cargo.toml), which release-plz bumps.
dynamic = ["version"]
description = "Write lsdocs plugins in Python."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0 OR MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Documentation",
    "Topic :: Text Processing :: Markup",
]

[dependency-groups]
dev = ["maturin>=1.9,<2", "pytest>=8", "msgpack>=1"]

[tool.maturin]
# The Rust extension is `lsdocs_plugin._native`; the Python API around it
# lives in python/lsdocs_plugin.
python-source = "python"
module-name = "lsdocs_plugin._native"

[tool.pytest.ini_options]
testpaths = ["tests"]
